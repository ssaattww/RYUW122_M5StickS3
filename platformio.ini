; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-sticks3

[env:m5stack-sticks3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    M5PM1=https://github.com/m5stack/M5PM1
    RYUW122=xreef/RYUW122@^1.0.1
    ; ESP_NowAdhoc=https://github.com/hinyhiny/ESP_NowAdhoc.git
monitor_speed = 115200
monitor_filters = direct
monitor_eol = CR
monitor_echo = no

[env:native]
platform = native
test_framework = unity
test_filter = test_t003
test_build_src = yes
extra_scripts = pre:test/test_t003/native_toolchain.py
build_src_filter =
    -<*>
    +<NodeStatus.cpp>
    +<TagMasterCoordinator.cpp>
build_flags =
    -std=gnu++17
    -iquote test/test_t003/stubs
    -Itest/test_t003/stubs

[env:native_t004]
platform = native
test_framework = unity
test_filter = test_t004
